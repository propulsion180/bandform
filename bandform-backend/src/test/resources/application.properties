# Test-only configuration. This file fully shadows the main
# application.properties on the test classpath, so it must carry every property
# the context needs to boot under test.
spring.application.name=bandform-backend

# A fixed >=32-byte secret so JwtUtil.validateSecret() passes without an env var.
auth.jwt.secret=test-secret-that-is-at-least-32-bytes-long-000

# Deterministic tests: no dev seeder, plain (non-secure) cookies, permissive CORS.
app.seed-data.enabled=false
auth.cookie.secure=false
auth.cors.allowed-origins=http://localhost:3000

spring.graphql.websocket.path=/graphql-ws

# Isolated in-memory database, recreated per run.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
