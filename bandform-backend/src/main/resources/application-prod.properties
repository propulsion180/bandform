# Production overrides. Activated with SPRING_PROFILES_ACTIVE=prod.
# Shared defaults live in application.properties; this file only changes what
# must differ in production. See DEPLOYMENT.md for the required environment.

# Served over HTTPS behind a reverse proxy: the session cookie must be Secure.
# Frontend and backend are same-origin behind the proxy, so CORS isn't
# exercised in normal use; the allowed origin stays configurable regardless.
auth.cookie.secure=true
auth.cors.allowed-origins=${FRONTEND_ORIGIN}

# No seeded demo accounts and no H2 console in production.
app.seed-data.enabled=false
spring.h2.console.enabled=false

# Persistent Postgres (self-hosted / Docker). All values come from the
# environment; Hibernate manages the schema for now (introduce Flyway later).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
