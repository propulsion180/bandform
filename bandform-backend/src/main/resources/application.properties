spring.application.name=bandform-backend
spring.graphql.websocket.path=/graphql-ws
auth.jwt.secret=${SERVER_JWT_SECRET}
# set auth.cookie.secure=true and add the deployed frontend origin to
# auth.cors.allowed-origins once served over HTTPS
auth.cookie.secure=false
auth.cors.allowed-origins=http://localhost:3000
# set to false once this runs against a persistent (non-H2) database
app.seed-data.enabled=true
